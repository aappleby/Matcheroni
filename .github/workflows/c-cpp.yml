name: C/C++ CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Get Hancho
      uses: actions/checkout@v3
      with:
        repository: aappleby/hancho
        ref: e8271b6f9a0f48efc7a910cb1fdb5f4fb2b6878b
        path: .hancho
    - name: Get Boost
      run: sudo apt install libboost-regex-dev libboost-system-dev
    - name: Run Hancho build and tests
      run: python3 .hancho/hancho.py
